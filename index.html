<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زيؤان | دليل إعداد المشروع البيداغوجي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{
  --green-950:#04241a;
  --green-900:#0a3d2c;
  --green-800:#0f5138;
  --green-700:#146849;
  --green-100:#e6f2ec;
  --gold:#c9a227;
  --gold-light:#e6c65c;
  --blue:#1b4f9c;
  --purple:#6b3fa0;
  --paper:#f6f5f0;
  --paper-dim:#ece9df;
  --ink:#17241d;
  --ink-soft:#4a5750;
  --white:#ffffff;
  --danger:#b23b3b;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow-soft:0 10px 30px -12px rgba(10,61,44,0.25);
  --shadow-card:0 4px 18px -6px rgba(10,61,44,0.18);
  font-family:'Cairo','IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 90% -10%, rgba(201,162,39,0.10), transparent 60%),
    radial-gradient(1000px 500px at -10% 10%, rgba(27,79,156,0.08), transparent 55%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  line-height:1.65;
}
::selection{background:var(--gold-light);color:var(--green-950);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:800;}
p{margin:0;}
.hidden{display:none !important;}
.container{max-width:1180px;margin:0 auto;padding:0 22px;}

/* ---------- Glass card ---------- */
.glass{
  background:rgba(255,255,255,0.68);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,0.55);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(10,61,44,0.97), rgba(10,61,44,0.94));
  color:#fff;
  border-bottom:3px solid var(--gold);
}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 22px;max-width:1180px;margin:0 auto;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-emblem{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #8a6c15 100%);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--green-950);font-size:18px;
  box-shadow:0 0 0 3px rgba(255,255,255,0.15);
  flex-shrink:0;
}
.brand-text .t1{font-size:14px;font-weight:600;color:var(--gold-light);letter-spacing:.5px;}
.brand-text .t2{font-size:17px;font-weight:800;}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.chip-btn{
  background:rgba(255,255,255,0.10);
  color:#fff;border:1px solid rgba(255,255,255,0.25);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.2s;
}
.chip-btn:hover{background:rgba(255,255,255,0.2);}
.progress-pill{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;
  color:var(--gold-light);
}
.progress-track{width:90px;height:6px;background:rgba(255,255,255,0.2);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:6px;transition:width .4s ease;}

/* ---------- Hero / Home ---------- */
.hero{padding:64px 0 40px;}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--green-100);color:var(--green-800);
  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;
  border:1px solid rgba(15,81,56,0.15);
}
.hero h1{
  font-size:clamp(28px,4.2vw,46px);
  margin-top:18px;line-height:1.25;
  color:var(--green-950);
}
.hero h1 span{color:var(--gold);}
.hero p.lead{
  margin-top:16px;font-size:17px;color:var(--ink-soft);max-width:760px;
}
.hero-cta{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;}
.btn{
  border:none;border-radius:999px;padding:15px 30px;font-weight:800;font-size:15.5px;
  display:inline-flex;align-items:center;gap:10px;transition:.2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--green-800),var(--green-950));
  color:#fff;box-shadow:0 12px 24px -10px rgba(10,61,44,0.55);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(10,61,44,0.6);}
.btn-gold{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--green-950);
}
.btn-gold:hover{transform:translateY(-2px);}
.btn-ghost{
  background:transparent;border:1.5px solid rgba(10,61,44,0.25);color:var(--green-900);
}
.btn-ghost:hover{background:rgba(10,61,44,0.06);}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}

.legal-strip{
  margin-top:38px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;
}
.legal-card{padding:18px 20px;}
.legal-card .ic{font-size:22px;}
.legal-card h4{font-size:14.5px;margin-top:10px;color:var(--green-900);}
.legal-card p{font-size:13px;color:var(--ink-soft);margin-top:6px;}

.section{padding:46px 0;}
.section-head{margin-bottom:26px;}
.eyebrow{
  color:var(--gold);font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;
}
.section-head h2{font-size:clamp(22px,3vw,30px);margin-top:8px;color:var(--green-950);}
.section-head p{color:var(--ink-soft);margin-top:8px;max-width:680px;font-size:15px;}

.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;}

.dash-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
.dash-step{
  background:#fff;border:1.5px solid rgba(10,61,44,.12);border-radius:14px;padding:14px 12px;text-align:center;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow-card);
}
.dash-step:hover{transform:translateY(-3px);}
.dash-step.dash-locked{cursor:not-allowed;opacity:.5;}
.dash-step.dash-locked:hover{transform:none;}
.dash-icon{font-size:22px;margin-bottom:8px;}
.dash-lbl{font-size:11.5px;font-weight:700;color:var(--ink-soft);line-height:1.4;}
.dash-step.dash-done{background:var(--green-100);border-color:var(--green-700);}
.dash-step.dash-done .dash-lbl{color:var(--green-900);}
.dash-step.dash-partial{background:#fdf9ec;border-color:var(--gold);}
.dash-step.dash-partial .dash-lbl{color:#8a6c15;}
.info-card{padding:22px;}
.info-card .num{
  width:34px;height:34px;border-radius:10px;
  background:var(--green-900);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:12px;
}
.info-card h4{font-size:15px;color:var(--green-950);}
.info-card p{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}

/* ---------- Wizard layout ---------- */
.wizard-wrap{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start;padding:30px 0 70px;}
@media (max-width:880px){.wizard-wrap{grid-template-columns:1fr;}}

.stepper{
  position:sticky;top:88px;padding:20px 16px;
}
.stepper h3{font-size:13px;color:var(--green-900);padding:0 8px 12px;text-transform:uppercase;letter-spacing:.5px;}
.stepper-list{list-style:none;margin:0;padding:0;position:relative;}
.stepper-list::before{
  content:"";position:absolute;right:24px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(var(--paper-dim),var(--paper-dim));
}
.step-item{
  display:flex;align-items:flex-start;gap:12px;padding:9px 8px;border-radius:12px;
  cursor:pointer;position:relative;z-index:1;transition:.15s;
}
.step-item:hover{background:rgba(10,61,44,0.06);}
.step-item.locked{cursor:not-allowed;opacity:.5;}
.step-item .dot{
  width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--paper-dim);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink-soft);
  flex-shrink:0;transition:.2s;
}
.step-item.done .dot{background:var(--green-800);border-color:var(--green-800);color:#fff;}
.step-item.active .dot{background:var(--gold);border-color:var(--gold);color:var(--green-950);box-shadow:0 0 0 4px rgba(201,162,39,0.25);}
.step-item .lbl{font-size:13.5px;font-weight:700;color:var(--ink);padding-top:6px;}
.step-item.active .lbl{color:var(--green-950);}

.step-panel{padding:32px;min-height:520px;}
.step-header{border-bottom:1px dashed rgba(10,61,44,0.18);padding-bottom:20px;margin-bottom:24px;}
.step-kicker{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:800;font-size:13px;}
.step-kicker .circle{
  width:28px;height:28px;border-radius:50%;background:var(--green-950);color:var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;
}
.step-panel h2{font-size:23px;color:var(--green-950);margin-top:10px;}
.step-panel .subtitle{color:var(--ink-soft);font-size:14.5px;margin-top:6px;}

.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
@media (max-width:700px){.ref-grid{grid-template-columns:1fr;}}
.ref-box{background:var(--paper);border-radius:var(--radius-md);padding:16px 18px;border:1px solid rgba(10,61,44,0.08);}
.ref-box h5{font-size:13px;color:var(--green-800);display:flex;align-items:center;gap:7px;}
.ref-box ul{margin:10px 0 0;padding-inline-start:18px;font-size:13.3px;color:var(--ink-soft);}
.ref-box ul li{margin-bottom:5px;}
.ref-box.warn{background:#fbf1f1;border-color:rgba(178,59,59,0.15);}
.ref-box.warn h5{color:var(--danger);}
.ref-box.tip{background:#eef6f0;border-color:rgba(15,81,56,0.15);}
.ref-box.tip h5{color:var(--green-800);}

.form-block{margin-bottom:22px;}
.form-block label{display:block;font-size:14px;font-weight:700;color:var(--green-950);margin-bottom:8px;}
.form-block .hint{font-size:12.3px;color:var(--ink-soft);margin-top:6px;}
.form-block textarea, .form-block input[type=text], .form-block select{
  width:100%;border:1.5px solid rgba(10,61,44,0.18);border-radius:var(--radius-sm);
  padding:12px 14px;font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);
  transition:.15s;
}
.form-block textarea{min-height:90px;resize:vertical;}
.form-block textarea:focus, .form-block input:focus, .form-block select:focus{
  outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,0.18);
}
.required-mark{color:var(--danger);margin-inline-start:3px;}
.field-error{border-color:var(--danger) !important;}
.error-msg{color:var(--danger);font-size:12.3px;margin-top:6px;display:none;}
.error-msg.show{display:block;}

.field-example{margin-top:8px;}
.example-toggle{
  background:none;border:none;color:var(--blue);font-size:12.3px;font-weight:700;padding:2px 0;
  display:inline-flex;align-items:center;gap:5px;
}
.example-toggle:hover{text-decoration:underline;}
.example-box{
  margin-top:8px;background:#fdf9ec;border:1.5px dashed var(--gold);border-radius:10px;padding:12px 14px;
}
.example-box.hidden{display:none;}
.example-box .ex-content{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;line-height:1.6;}
.example-box .ex-content table{width:100%;border-collapse:collapse;margin-top:4px;font-size:12.3px;}
.example-box .ex-content th{background:var(--paper-dim);padding:5px 8px;text-align:right;font-size:11.3px;}
.example-box .ex-content td{padding:5px 8px;border-bottom:1px solid var(--paper-dim);}
.example-box .use-example-btn{
  margin-top:10px;background:var(--gold);color:var(--green-950);border:none;border-radius:8px;
  padding:7px 14px;font-size:12.3px;font-weight:800;
}

.checklist{display:flex;flex-wrap:wrap;gap:10px;}
.chk-opt{
  display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid rgba(10,61,44,0.15);
  padding:9px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;transition:.15s;
}
.chk-opt input{accent-color:var(--green-800);}
.chk-opt.checked{background:var(--green-100);border-color:var(--green-700);color:var(--green-900);font-weight:700;}

.group-field table{width:100%;border-collapse:collapse;font-size:13.3px;}
.group-field th{
  background:var(--green-900);color:#fff;text-align:right;padding:10px 12px;font-size:12.5px;font-weight:700;
}
.group-field th:first-child{border-radius:10px 0 0 0;}
.group-field th:last-child{border-radius:0 10px 0 0;}
.group-field td{padding:8px;border-bottom:1px solid rgba(10,61,44,0.1);background:#fff;vertical-align:top;}
.group-field td input, .group-field td textarea{
  width:100%;border:1px solid rgba(10,61,44,0.15);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;
}
.group-field .rm-row{background:transparent;border:none;color:var(--danger);font-size:17px;font-weight:900;}
.group-cards{display:none;}
@media (max-width:760px){
  .group-field table{display:none;}
  .group-cards{display:block;}
  .group-card{background:#fff;border:1px solid rgba(10,61,44,0.12);border-radius:12px;padding:14px;margin-bottom:12px;}
  .group-card .gc-field{margin-bottom:8px;}
  .group-card .gc-field label{font-size:12px;font-weight:700;color:var(--green-800);display:block;margin-bottom:4px;}
  .group-card .gc-field input, .group-card .gc-field textarea{width:100%;border:1px solid rgba(10,61,44,0.15);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;}
}
.add-row-btn{
  margin-top:10px;background:var(--green-100);color:var(--green-900);border:1.5px dashed var(--green-700);
  padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;
}

.step-summary-box{
  background:var(--green-100);border-radius:var(--radius-md);padding:18px 20px;margin-top:26px;border:1px solid rgba(15,81,56,0.15);
}
.step-summary-box h5{color:var(--green-900);font-size:13.5px;display:flex;align-items:center;gap:7px;}
.step-summary-box .sm-content{font-size:13px;color:var(--ink-soft);margin-top:8px;white-space:pre-wrap;}

.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:22px;border-top:1px dashed rgba(10,61,44,0.18);}
.step-nav .right-group{display:flex;gap:10px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green-950);color:#fff;padding:13px 24px;border-radius:999px;font-size:13.5px;font-weight:700;
  box-shadow:0 10px 30px -8px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:.3s;z-index:200;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Library ---------- */
.lib-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.lib-tab{
  background:#fff;border:1.5px solid rgba(10,61,44,0.15);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);
}
.lib-tab.active{background:var(--green-900);color:#fff;border-color:var(--green-900);}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.lib-card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
.lib-card .lib-num{
  width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--green-950);font-weight:900;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;
}
.lib-card h4{font-size:15px;color:var(--green-950);}
.lib-card .lib-meta{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;}
.lib-card .lib-goal{font-size:13px;color:var(--ink-soft);}
.lib-card .lib-tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--paper-dim);color:var(--green-900);font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700;}
.lib-basic-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px;}
.lib-basic-item{background:#fff;border:1px solid rgba(10,61,44,0.12);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center;}
.lib-basic-item .n{color:var(--gold);font-weight:900;}

/* ---------- Summary / final document ---------- */
.doc-wrap{padding:32px;}
.doc-cover{
  background:linear-gradient(135deg,var(--green-950),var(--green-800));
  color:#fff;border-radius:var(--radius-md);padding:34px;text-align:center;margin-bottom:30px;
}
.doc-cover .k1{color:var(--gold-light);font-weight:800;font-size:13px;letter-spacing:1px;}
.doc-cover h2{font-size:26px;margin-top:12px;}
.doc-cover .meta{margin-top:16px;display:flex;justify-content:center;gap:26px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,0.85);}
.doc-section{margin-bottom:24px;padding:20px 22px;background:#fff;border-radius:var(--radius-md);border:1px solid rgba(10,61,44,0.1);}
.doc-section h3{font-size:15.5px;color:var(--green-950);display:flex;align-items:center;gap:9px;}
.doc-section h3 .n{
  width:26px;height:26px;border-radius:7px;background:var(--green-900);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.doc-section .doc-body{margin-top:12px;font-size:13.5px;color:var(--ink-soft);}
.doc-body table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.6px;}
.doc-body th{background:var(--paper-dim);padding:7px 9px;text-align:right;font-size:11.8px;}
.doc-body td{padding:7px 9px;border-bottom:1px solid var(--paper-dim);}
.doc-empty{color:#b3a98f;font-style:italic;}
.completion-banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--green-100);border:1px solid rgba(15,81,56,0.2);border-radius:var(--radius-md);
  padding:18px 22px;margin-bottom:24px;
}
.completion-banner .cb-txt strong{color:var(--green-950);font-size:15px;}
.completion-banner .cb-txt p{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.doc-actions{display:flex;gap:10px;flex-wrap:wrap;}

footer.site-footer{
  background:var(--green-950);color:rgba(255,255,255,0.75);padding:30px 0;margin-top:40px;font-size:12.8px;text-align:center;
}
footer.site-footer strong{color:var(--gold-light);}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- Approval / signature block ---------- */
.doc-approval .approval-grid{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;}
.doc-approval .approval-col{flex:1;min-width:220px;}
.doc-approval .approval-col p{font-size:13.5px;color:var(--ink-soft);margin-bottom:8px;}
.doc-approval .signature-line{margin-top:30px;border-top:1px solid #b9b195;padding-top:8px;font-size:13px;color:var(--ink-soft);}
.doc-approval .stamp-box{
  border:2px dashed #c9c3ad;border-radius:12px;min-height:120px;
  display:flex;align-items:center;justify-content:center;color:#a39b7f;font-size:13px;font-weight:700;
}
.print-toc{display:none;}
.print-tip{
  background:#fdf9ec;border:1px solid rgba(201,162,39,.35);border-radius:10px;padding:10px 14px;
  font-size:12.3px;color:var(--green-900);margin-bottom:18px;display:flex;gap:8px;align-items:flex-start;
}

@media print{
  .topbar,.stepper,.hero-cta,.step-nav,.doc-actions,.no-print,footer.site-footer,.completion-banner,.assist-fab,.assist-panel,.print-tip{display:none !important;}
  body{background:#fff;}
  .doc-wrap{padding:0;}
  .doc-section{break-inside:avoid;border:1px solid #ccc;break-before:page;}
  .doc-section:first-of-type{break-before:auto;}
  .doc-cover{break-after:page;}
  .print-toc{display:block;break-after:page;padding:30px 10px;}
  .wizard-wrap{display:block;padding:0;}

/* =====================================================================
   STATE MANAGEMENT — multi-project support.
   Each project is stored under its own localStorage key; an index lists
   all saved projects (id, name, last update, used for the "مشاريعي" view).
   Legacy single-project data (from earlier versions of this file) is
   migrated automatically into the new scheme on first load.
===================================================================== */
const LEGACY_STORAGE_KEY = 'zawan_bidaghoji_project_v1';
const PROJECTS_INDEX_KEY = 'zawan_projects_index_v1';
const ACTIVE_PROJECT_KEY = 'zawan_active_project_id_v1';
function projectStateKey(id){ return 'zawan_project_' + id; }

const defaultState = {
  meta:{ projectName:'', institution:'', club:'', dateCreated:'', responsibleName:'', responsibleRole:'', approvalDate:'' },
  answers:{},          // fieldId -> value
  completedSteps:[],   // array of step ids fully valid
  currentStep:0,
  visited:[0]
};

function genId(){
  return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}
function loadProjectsIndex(){
  try{ return JSON.parse(localStorage.getItem(PROJECTS_INDEX_KEY)) || []; }catch(e){ return []; }
}
function saveProjectsIndex(idx){
  localStorage.setItem(PROJECTS_INDEX_KEY, JSON.stringify(idx));
}
function migrateLegacyIfNeeded(){
  const idx = loadProjectsIndex();
  if(idx.length>0) return;
  const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
  if(!legacyRaw) return;
  try{
    const legacyState = JSON.parse(legacyRaw);
    const id = genId();
    localStorage.setItem(projectStateKey(id), JSON.stringify(legacyState));
    const name = (legacyState.meta && legacyState.meta.projectName && legacyState.meta.projectName.trim()) || 'مشروعي الأول';
    saveProjectsIndex([{id, name, updatedAt: Date.now()}]);
    localStorage.setItem(ACTIVE_PROJECT_KEY, id);
    localStorage.removeItem(LEGACY_STORAGE_KEY);
  }catch(e){ /* ignore corrupt legacy data */ }
}
function ensureActiveProject(){
  migrateLegacyIfNeeded();
  let idx = loadProjectsIndex();
  let activeId = localStorage.getItem(ACTIVE_PROJECT_KEY);
  if(!activeId || !idx.find(p=>p.id===activeId)){
    if(idx.length>0){
      activeId = idx[0].id;
    } else {
      activeId = genId();
      localStorage.setItem(projectStateKey(activeId), JSON.stringify(defaultState));
      idx = [{id:activeId, name:'مشروع بيداغوجي جديد', updatedAt: Date.now()}];
      saveProjectsIndex(idx);
    }
    localStorage.setItem(ACTIVE_PROJECT_KEY, activeId);
  }
  return activeId;
}

let activeProjectId = null;

function loadState(){
  activeProjectId = ensureActiveProject();
  try{
    const raw = localStorage.getItem(projectStateKey(activeProjectId));
    const parsed = raw ? JSON.parse(raw) : {};
    return Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed, {
      meta: Object.assign({}, defaultState.meta, parsed.meta || {})
    });
  }catch(e){ return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState(){
  localStorage.setItem(projectStateKey(activeProjectId), JSON.stringify(state));
  const idx = loadProjectsIndex();
  const name = (state.meta.projectName && state.meta.projectName.trim()) || 'مشروع بدون عنوان';
  const entry = idx.find(p=>p.id===activeProjectId);
  if(entry){ entry.name = name; entry.updatedAt = Date.now(); }
  else { idx.push({id:activeProjectId, name, updatedAt: Date.now()}); }
  saveProjectsIndex(idx);
}
function resetState(){
  state = JSON.parse(JSON.stringify(defaultState));
  saveState();
}

let state = loadState();

/* ---------- Project switching / management ---------- */
function switchToProject(id){
  if(id===activeProjectId) return;
  saveState();
  activeProjectId = id;
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  state = loadState();
  recomputeCompleted();
  toast('تم فتح المشروع', '📂');
  showView('wizard');
}
function confirmCreateProject(){
  const nameInput = document.getElementById('newProjectNameInput');
  const name = (nameInput && nameInput.value.trim()) || 'مشروع بيداغوجي جديد';
  saveState();
  const id = genId();
  const st = JSON.parse(JSON.stringify(defaultState));
  st.meta.projectName = name;
  localStorage.setItem(projectStateKey(id), JSON.stringify(st));
  const idx = loadProjectsIndex();
  idx.push({id, name, updatedAt: Date.now()});
  saveProjectsIndex(idx);
  activeProjectId = id;
  localStorage.setItem(ACTIVE_PROJECT_KEY, id);
  state = loadState();
  recomputeCompleted();
  showNewProjectForm = false;
  toast('تم إنشاء مشروع جديد', '✨');
  showView('wizard');
}
let showNewProjectForm = false;
function toggleNewProjectForm(){ showNewProjectForm = !showNewProjectForm; renderNewProjectForm(); }
function cancelNewProject(){ showNewProjectForm = false; renderNewProjectForm(); }
function duplicateProject(id){
  const raw = localStorage.getItem(projectStateKey(id));
  if(!raw) return;
  const st = JSON.parse(raw);
  const newId = genId();
  st.meta.projectName = ((st.meta && st.meta.projectName) || 'مشروع') + ' (نسخة)';
  localStorage.setItem(projectStateKey(newId), JSON.stringify(st));
  const idx = loadProjectsIndex();
  idx.push({id:newId, name: st.meta.projectName, updatedAt: Date.now()});
  saveProjectsIndex(idx);
  toast('تم إنشاء نسخة من المشروع', '📄');
  renderProjects();
}
function deleteProjectConfirm(id){
  const idx = loadProjectsIndex();
  const entry = idx.find(p=>p.id===id);
  if(!confirm('سيتم حذف المشروع «' + (entry?entry.name:'') + '» نهائياً من هذا الجهاز. هل تريد المتابعة؟')) return;
  localStorage.removeItem(projectStateKey(id));
  const newIdx = idx.filter(p=>p.id!==id);
  saveProjectsIndex(newIdx);
  if(id===activeProjectId){
    if(newIdx.length>0){
      activeProjectId = null;
      switchToProject(newIdx[0].id);
    } else {
      localStorage.removeItem(ACTIVE_PROJECT_KEY);
      activeProjectId = null;
      state = loadState();
      recomputeCompleted();
    }
  }
  toast('تم حذف المشروع', '🗑️');
  renderProjects();
}

/* =====================================================================
   UTIL
===================================================================== */
function esc(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg, icon){
  const t = document.getElementById('toast');
  t.innerHTML = (icon||'✅') + ' <span>'+esc(msg)+'</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function overallProgress(){
  return Math.round((state.completedSteps.length / STEPS.length) * 100);
}
function updateTopProgress(){
  const p = overallProgress();
  document.getElementById('topProgressLabel').textContent = p+'%';
  document.getElementById('topProgressFill').style.width = p+'%';
}
function isStepComplete(step){
  return state.completedSteps.includes(step.id);
}
function isStepUnlocked(index){
  if(index===0) return true;
  const prev = STEPS[index-1];
  return isStepComplete(prev) || state.visited.includes(index);
}
function stepStatus(step){
  if(isStepComplete(step)) return 'done';
  const hasAny = step.fields.some(f=>{
    const v = state.answers[f.id];
    if(f.type==='group') return (v||[]).some(r=>Object.values(r).some(x=>x && String(x).trim()!==''));
    if(f.type==='checklist') return v && v.length>0;
    return v && String(v).trim()!=='';
  });
  return hasAny ? 'partial' : 'empty';
}
function openStepDirectly(index){
  if(!state.visited.includes(index)) state.visited.push(index);
  state.currentStep = index;
  saveState();
  showView('wizard');
}
function validateStep(step){
  let ok = true;
  const missing = [];
  step.fields.forEach(f=>{
    if(!f.required) return;
    const val = state.answers[f.id];
    if(f.type==='group'){
      const rows = val || [];
      const hasValidRow = rows.some(r => Object.values(r).some(v=>v && String(v).trim()!==''));
      if(!hasValidRow){ ok=false; missing.push(f.label); }
    } else if(f.type==='checklist'){
      if(!val || val.length===0){ ok=false; missing.push(f.label); }
    } else {
      if(!val || String(val).trim()===''){ ok=false; missing.push(f.label); }
    }
  });
  return {ok, missing};
}
function recomputeCompleted(){
  state.completedSteps = STEPS.filter(s=>validateStep(s).ok).map(s=>s.id);
}

function renderWizard(){

  const stepperHtml = STEPS.map((s,i)=>{
    const done = isStepComplete(s);
    const active = i===idx;
    const locked = !isStepUnlocked(i) && !done;

    if(done) cls+=' done';
    if(active) cls+=' active';
    if(locked) cls+=' locked';
    return `<li class="${cls}" onclick="${locked?'':'jumpToStep('+i+')'}">
      <div class="dot">${done?'✓':(s.num)}</div>

/* ---------- Field rendering ---------- */
function renderField(f){
  const val = state.answers[f.id];
  const reqMark = f.required ? '<span class="required-mark">*</span>' : '';
  let inner = '';
  if(f.type==='text'){
    inner = `<input type="text" data-field="${f.id}" placeholder="${esc(f.placeholder||'')}" value="${esc(val||'')}">`;
  } else if(f.type==='textarea'){
    inner = `<textarea data-field="${f.id}" placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>`;
  } else if(f.type==='checklist'){
    inner = `<div class="checklist" data-field="${f.id}">` + f.options.map(o=>{
      const checked = (val||[]).includes(o.key);
      return `<label class="chk-opt${checked?' checked':''}"><input type="checkbox" value="${esc(o.key)}" ${checked?'checked':''}> ${esc(o.label)}</label>`;
    }).join('') + `</div>`;
  } else if(f.type==='group'){
    inner = renderGroupField(f, val || []);
  }
  const exampleHtml = f.example!==undefined ? renderFieldExample(f) : '';
  return `<div class="form-block" data-block="${f.id}">
    <label>${esc(f.label)} ${reqMark}</label>
    ${inner}
    <div class="error-msg" data-error="${f.id}">هذا الحقل أساسي لإكمال هذه المرحلة.</div>
    ${exampleHtml}
  </div>`;
}

function renderFieldExample(f){
  let content = '';
  if(f.type==='text' || f.type==='textarea'){
    content = esc(f.example).replace(/\n/g,'<br>');
  } else if(f.type==='checklist'){
    content = f.example.map(k=>{
      const opt = f.options.find(o=>o.key===k);
      return '✔ ' + esc(opt ? opt.label : k);
    }).join('<br>');
  } else if(f.type==='group'){
    content = `<table><thead><tr>${f.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${f.example.map(r=>`<tr>${f.columns.map(c=>`<td>${esc(r[c.id]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return `<div class="field-example">
    <button type="button" class="example-toggle" onclick="toggleFieldExample('${f.id}')">💡 عرض مثال توضيحي</button>
    <div class="example-box hidden" id="example-${f.id}">
      <div class="ex-content">${content}</div>
      <button type="button" class="use-example-btn" onclick="useFieldExample('${f.id}')">استخدام هذا المثال</button>
    </div>
  </div>`;
}

function renderGroupField(f, rows){
  if(!rows || rows.length===0) rows = [ emptyGroupRow(f) ];
  const theadCols = f.columns.map(c=>`<th>${esc(c.label)}</th>`).join('') + '<th style="width:36px;"></th>';
  const tbodyRows = rows.map((row,ri)=>{
    const tds = f.columns.map(c=>`<td><input type="text" data-grp="${f.id}" data-row="${ri}" data-col="${c.id}" value="${esc(row[c.id]||'')}"></td>`).join('');
    return `<tr>${tds}<td><button type="button" class="rm-row" onclick="removeGroupRow('${f.id}', ${ri})" title="حذف السطر">×</button></td></tr>`;
  }).join('');

  const cardsHtml = rows.map((row,ri)=>{
    const fields = f.columns.map(c=>`<div class="gc-field"><label>${esc(c.label)}</label><input type="text" data-grp="${f.id}" data-row="${ri}" data-col="${c.id}" value="${esc(row[c.id]||'')}"></div>`).join('');
    return `<div class="group-card">${fields}<button type="button" class="btn btn-ghost btn-sm" onclick="removeGroupRow('${f.id}', ${ri})">حذف هذا السطر ×</button></div>`;
  }).join('');

  return `<div class="group-field" data-group="${f.id}">
    <table><thead><tr>${theadCols}</tr></thead><tbody>${tbodyRows}</tbody></table>
    <div class="group-cards">${cardsHtml}</div>
    <button type="button" class="add-row-btn" onclick="addGroupRow('${f.id}')">➕ إضافة سطر جديد</button>
  </div>`;
}
function emptyGroupRow(f){
  const r = {}; f.columns.forEach(c=>r[c.id]=''); return r;
}
function currentStepFieldDef(fieldId){
  const step = STEPS[state.currentStep];
  return step.fields.find(f=>f.id===fieldId);
}
function addGroupRow(fieldId){
  const f = currentStepFieldDef(fieldId);
  if(!state.answers[fieldId] || state.answers[fieldId].length===0) state.answers[fieldId]=[emptyGroupRow(f)];
  state.answers[fieldId].push(emptyGroupRow(f));
  saveState();
  rerenderCurrentStepPreserveScroll();
}
function removeGroupRow(fieldId, rowIndex){
  if(!state.answers[fieldId]) return;
  state.answers[fieldId].splice(rowIndex,1);
  saveState();
  rerenderCurrentStepPreserveScroll();
}
function rerenderCurrentStepPreserveScroll(){
  const y = window.scrollY;
  renderStepPanel(STEPS[state.currentStep], state.currentStep);
  window.scrollTo(0,y);
}

/* ---------- Field listeners ---------- */
function attachFieldListeners(step){
  step.fields.forEach(f=>{
    if(f.type==='text' || f.type==='textarea'){
      const el = document.querySelector(`[data-field="${f.id}"]`);
      if(el) el.addEventListener('input', ()=>{
        state.answers[f.id] = el.value;
        saveState();
        clearFieldError(f.id);
      });
    } else if(f.type==='checklist'){
      const wrap = document.querySelector(`.checklist[data-field="${f.id}"]`);
      if(wrap){
        wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
          cb.addEventListener('change', ()=>{
            let arr = state.answers[f.id] || [];
            if(cb.checked){ if(!arr.includes(cb.value)) arr.push(cb.value); }
            else { arr = arr.filter(v=>v!==cb.value); }
            state.answers[f.id] = arr;
            saveState();
            cb.closest('.chk-opt').classList.toggle('checked', cb.checked);
            clearFieldError(f.id);
          });
        });
      }
    } else if(f.type==='group'){
      document.querySelectorAll(`[data-grp="${f.id}"]`).forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const ri = +inp.dataset.row, ci = inp.dataset.col;
          if(!state.answers[f.id]) state.answers[f.id] = [emptyGroupRow(f)];
          if(!state.answers[f.id][ri]) state.answers[f.id][ri] = emptyGroupRow(f);
          state.answers[f.id][ri][ci] = inp.value;
          saveState();
          clearFieldError(f.id);
        });
      });
    }
  });
}
function clearFieldError(fieldId){
  const block = document.querySelector(`[data-block="${fieldId}"]`);
  if(!block) return;
  block.querySelector('.error-msg')?.classList.remove('show');
  block.querySelectorAll('.field-error').forEach(e=>e.classList.remove('field-error'));
}

/* ---------- Navigation ---------- */
function nextStep(){
  const step = STEPS[state.currentStep];
  const v = validateStep(step);
  if(!v.ok){
    v.missing.forEach(()=>{});
    step.fields.forEach(f=>{
      if(!f.required) return;
      const val = state.answers[f.id];
      let bad=false;
      if(f.type==='group'){ bad = !(val||[]).some(r=>Object.values(r).some(x=>x&&String(x).trim()!=='')); }
      else if(f.type==='checklist'){ bad = !val || val.length===0; }
      else { bad = !val || String(val).trim()===''; }
      if(bad){
        const block = document.querySelector(`[data-block="${f.id}"]`);
        block?.querySelector('.error-msg')?.classList.add('show');
      }
    });
    toast('يرجى استكمال الحقول الأساسية قبل المتابعة', '⚠️');
    const firstErr = document.querySelector('.error-msg.show');
    if(firstErr && typeof firstErr.scrollIntoView === 'function') firstErr.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  recomputeCompleted();
  const nextIdx = Math.min(state.currentStep+1, STEPS.length-1);
  if(!state.visited.includes(nextIdx)) state.visited.push(nextIdx);
  state.currentStep = nextIdx;
  saveState();
  renderWizard();
  toast('تم حفظ المرحلة والانتقال للمرحلة التالية');
}
function prevStep(){
  state.currentStep = Math.max(0, state.currentStep-1);
  saveState();
  renderWizard();
}
function saveDraftManually(){
  saveState();
  toast('تم حفظ المسودة محلياً على هذا الجهاز', '💾');
}
function finishWizard(){
  const step = STEPS[state.currentStep];
  const v = validateStep(step);
  if(!v.ok){ nextStep(); return; }
  recomputeCompleted();
  saveState();
  showView('summary');
}
function confirmReset(){
  if(confirm('سيتم حذف جميع بيانات المشروع الحالي نهائياً من هذا الجهاز. هل تريد المتابعة؟')){
    resetState();
    toast('تمت إعادة ضبط المشروع', '♻️');
    showView('home');
  }
}

  const idea = LIBRARY_FULL.find(x=>x.num===num);

  const proceed = hasDataAlready
    ? confirm('لديك بيانات مدخلة مسبقاً في المعالج. هل تريد استخدام هذه الفكرة كنقطة انطلاق لملء حقول التشخيص والهدف العام؟ (لن يتم حذف بقية بياناتك)')

  state.answers['diag_target'] = idea.target + ' — مجال: ' + idea.domain;

  const suggestedActivities = idea.activities.map(a=>({name:a, goal:'', target:idea.target, when:'', partners:''}));
  state.answers['plan_activities'] = suggestedActivities;
  const suggestedIndicators = idea.indicators.map(i=>({indicator:i, type:'', method:'', timing:''}));
  state.answers['mon_indicators'] = suggestedIndicators;

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportJSON(){
  const filename = 'مشروع-بيداغوجي-' + (state.meta.projectName || 'بدون-عنوان').replace(/[^a-zA-Z0-9\u0600-\u06FF_-]/g,'_') + '.json';

  toast('تم تصدير ملف JSON بنجاح', '📤');
}
function importJSON(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.answers) throw new Error('invalid');
      state = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
      saveState();
      recomputeCompleted();
      toast('تم استيراد المشروع بنجاح', '📥');

      toast('تعذّر قراءة الملف، تأكد أنه ملف JSON صادر عن هذا الدليل', '⚠️');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

/* =====================================================================
   WORD (.docx) EXPORT — fully offline, no libraries.
   A .docx file is just a ZIP archive of XML parts (OOXML WordprocessingML).
   Below: a minimal pure-JS ZIP writer (store method) + CRC32, plus a small
   WordprocessingML builder, so the final project can be exported as a
   real, valid Word document without any server or internet connection.
===================================================================== */
function crc32(bytes){
  let c;
  const table = crc32._table || (crc32._table = (function(){
    const t = [];
    for(let n=0;n<256;n++){
      c = n;
      for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      t[n] = c;
    }
    return t;
  })());
  let crc = 0 ^ (-1);
  for(let i=0;i<bytes.length;i++){ crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF]; }
  return (crc ^ (-1)) >>> 0;
}
function docxStrToBytes(str){ return new TextEncoder().encode(str); }
function zU16(n){ return [n & 0xFF, (n>>>8) & 0xFF]; }
function zU32(n){ return [n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF]; }
function buildZip(files){
  let localParts = [], centralParts = [], offset = 0;
  files.forEach(f=>{
    const nameBytes = docxStrToBytes(f.name);
    const data = f.content;
    const crc = crc32(data);
    const size = data.length;
    const localHeader = [
      ...zU32(0x04034b50), ...zU16(20), ...zU16(0), ...zU16(0), ...zU16(0), ...zU16(0),
      ...zU32(crc), ...zU32(size), ...zU32(size), ...zU16(nameBytes.length), ...zU16(0)
    ];
    const localEntry = new Uint8Array(localHeader.length + nameBytes.length + data.length);
    localEntry.set(localHeader, 0);
    localEntry.set(nameBytes, localHeader.length);
    localEntry.set(data, localHeader.length + nameBytes.length);
    localParts.push(localEntry);
    const centralHeader = [
      ...zU32(0x02014b50), ...zU16(20), ...zU16(20), ...zU16(0), ...zU16(0), ...zU16(0), ...zU16(0),
      ...zU32(crc), ...zU32(size), ...zU32(size), ...zU16(nameBytes.length), ...zU16(0), ...zU16(0),
      ...zU16(0), ...zU16(0), ...zU32(0), ...zU32(offset)
    ];
    const centralEntry = new Uint8Array(centralHeader.length + nameBytes.length);
    centralEntry.set(centralHeader, 0);
    centralEntry.set(nameBytes, centralHeader.length);
    centralParts.push(centralEntry);
    offset += localEntry.length;
  });
  const centralSize = centralParts.reduce((a,p)=>a+p.length, 0);
  const centralOffset = offset;
  const eocd = [
    ...zU32(0x06054b50), ...zU16(0), ...zU16(0), ...zU16(files.length), ...zU16(files.length),
    ...zU32(centralSize), ...zU32(centralOffset), ...zU16(0)
  ];
  const out = new Uint8Array(offset + centralSize + eocd.length);
  let pos = 0;
  localParts.forEach(p=>{ out.set(p, pos); pos += p.length; });
  centralParts.forEach(p=>{ out.set(p, pos); pos += p.length; });
  out.set(new Uint8Array(eocd), pos);
  return out;
}

function xmlEsc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function docxP(text, opts){
  opts = opts || {};
  const styleTag = opts.style ? `<w:pStyle w:val="${opts.style}"/>` : '';
  const jc = opts.center ? 'center' : 'right';
  const bold = opts.bold ? '<w:b/>' : '';
  const lines = String(text===undefined||text===null?'':text).split('\n');
  return lines.map(line=>
    `<w:p><w:pPr>${styleTag}<w:bidi/><w:jc w:val="${jc}"/></w:pPr><w:r><w:rPr>${bold}<w:rtl/><w:lang w:bidi="ar-DZ"/></w:rPr><w:t xml:space="preserve">${xmlEsc(line)}</w:t></w:r></w:p>`
  ).join('');
}
function docxHeading(text, level){
  return `<w:p><w:pPr><w:pStyle w:val="Heading${level}"/><w:bidi/><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:rtl/><w:lang w:bidi="ar-DZ"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function docxTable(headers, rows){
  const tblGrid = headers.map(()=>`<w:gridCol/>`).join('');
  const headerRow = `<w:tr>${headers.map(h=>

function fieldValueDocx(f, val){

      const disp = fieldValueDocx(f, state.answers[f.id]);

  body += docxP('التوقيع: ______________________');

  body += docxP('');

<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${bodyContent}
<w:sectPr><w:bidi/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>
</w:body>
</w:document>`;
  const files = [
    {name:'[Content_Types].xml', content: docxStrToBytes(DOCX_CONTENT_TYPES)},
    {name:'_rels/.rels', content: docxStrToBytes(DOCX_RELS_ROOT)},
    {name:'docProps/core.xml', content: docxStrToBytes(docxCoreXml(title))},
    {name:'word/document.xml', content: docxStrToBytes(documentXml)},

}
function exportDocx(){

/* =====================================================================
   SMART ASSISTANT — fully offline, rule-based search & templating.
   No network calls at all. Its job: make the wizard approachable for a
   first-time user by (1) explaining the methodology in plain language,
   (2) suggesting ready-made projects from the bank, and (3) helping
   fill in each field, including one-click worked examples.
===================================================================== */
const assistState = { open:false, tab:'suggest', chat:[
  {role:'bot', text:'مرحباً 👋 أنا مساعدك المدمج لهذا الدليل (يعمل بالكامل دون إنترنت، مجاناً وفي كل مكان). أقدر أساعدك في: اقتراح مشروع جاهز من البنك، مساعدتك خطوة بخطوة في تعبئة المرحلة التي تعمل عليها، أو شرح أي مصطلح لا تفهمه من تبويب «📖 قاموس المصطلحات». جرّب أن تسألني: «اقترح لي مشروعاً عن الرياضة» أو «ما معنى SMART؟»'}
]};

function normalizeAr(s){
  if(!s) return '';
  return String(s)
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[\u064B-\u0652]/g,'') // diacritics
    .replace(/[^\u0621-\u064Aa-zA-Z0-9\s]/g,' ') // keep only Arabic letters + latin/digits
    .toLowerCase().trim();
}
function tokenize(s){
  return normalizeAr(s).split(/\s+/).filter(w=>w.length>1);
}
const STOPWORDS = new Set(['من','في','على','الى','إلى','عن','مع','هذا','هذه','ذلك','التي','الذي','و','او','أو','لل','هل','كيف','ما','ماذا','اقترح','لي','مشروع','فكرة','نادي','معنى']);
function meaningfulTokens(s){ return tokenize(s).filter(w=>!STOPWORDS.has(w)); }

function scoreText(tokens, text){
  const norm = normalizeAr(text);
  let score = 0;
  tokens.forEach(t=>{ if(norm.includes(t)) score += (t.length>3?2:1); });
  return score;
}
function searchLibrary(query, limit){
  const tokens = meaningfulTokens(query);
  if(tokens.length===0) return [];
  const scored = LIBRARY_FULL.map(item=>{
    const haystack = [item.title, item.domain, item.goal, ...(item.activities||[]), ...(item.indicators||[])].join(' ');
    return {item, score: scoreText(tokens, haystack), tier:'full'};
  });
  const scoredBasic = LIBRARY_BASIC.map(item=>({item, score: scoreText(tokens, item.title), tier:'basic'}));
  const all = [...scored, ...scoredBasic].filter(x=>x.score>0);
  all.sort((a,b)=>b.score-a.score);
  return all.slice(0, limit||5);
}
function bestStepMatch(query){
  const tokens = meaningfulTokens(query);
  if(tokens.length===0) return null;
  let best=null, bestScore=0;
  STEPS.forEach(step=>{
    const titleScore = scoreText(tokens, step.title + ' ' + step.subtitle) * 4;
    const bodyScore = scoreText(tokens, [step.objective, ...step.howTo, ...step.tips, ...step.mistakes].join(' '));
    const sc = titleScore + bodyScore;
    if(sc>bestScore){ bestScore=sc; best=step; }
  });
  return bestScore>0 ? best : null;
}
function bestGlossaryMatch(query){
  const tokens = meaningfulTokens(query);
  if(tokens.length===0) return null;
  let best=null, bestScore=0;
  GLOSSARY.forEach(g=>{
    const sc = scoreText(tokens, g.term + ' ' + g.def) * (scoreText(tokens, g.term)>0 ? 3 : 1);
    if(sc>bestScore){ bestScore=sc; best=g; }
  });
  return bestScore>0 ? best : null;
}

function renderAssistant(){
  const tabs = [
    {id:'suggest', label:'💡 اقتراح مشاريع'},
    {id:'fill', label:'✍️ مساعدة التعبئة'},
    {id:'chat', label:'💬 اسأل سؤالاً'},
    {id:'glossary', label:'📖 قاموس المصطلحات'}
  ];
  document.getElementById('assistTabs').innerHTML = tabs.map(t=>
    `<button class="assist-tab ${assistState.tab===t.id?'active':''}" onclick="switchAssistTab('${t.id}')">${t.label}</button>`
  ).join('');

  const body = document.getElementById('assistBody');
  if(assistState.tab==='suggest') body.innerHTML = renderSuggestTab();
  else if(assistState.tab==='fill') body.innerHTML = renderFillTab();
  else if(assistState.tab==='glossary') body.innerHTML = renderGlossaryTab();
  else body.innerHTML = renderChatTab();

  if(assistState.tab==='chat'){
    const log = document.getElementById('assistChatLog');
    if(log) log.scrollTop = log.scrollHeight;
    const inp = document.getElementById('assistChatInput');
    if(inp) inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendAssistChat(); } });

    const inp = document.getElementById('assistSearchInput');
    if(inp) inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); runAssistSearch(); } });
  }
}

    <p>${esc(mistake)}</p>

  return `<div class="assist-note">أنت الآن في مرحلة: <strong>${esc(step.title)}</strong>. هذه اقتراحات مخصصة لهذه المرحلة تحديداً.</div>` + cards;
}
function helpCard(icon, title, desc, onclickFn, btnLabel){
  return `<div class="assist-help-card">
    <h5>${icon} ${esc(title)}</h5>
    <p>${esc(desc)}</p>
    <button onclick="${onclickFn}">${esc(btnLabel)}</button>
  </div>`;
}

/* ---------- Insertion helpers (used by fill-help actions) ---------- */
function refreshIfFieldVisible(fieldId){
  const step = STEPS[state.currentStep];
  if(isWizardActive() && step.fields.some(f=>f.id===fieldId)){
    rerenderCurrentStepPreserveScroll();
  }
}
function assistFillDiagnosisNeeds(){
  const target = state.answers['diag_target'] || '';
  const matches = searchLibrary(target, 2);
  if(matches.length===0){
    toast('اكتب الفئة المستهدفة أو المجال أولاً لأتمكن من الاقتراح', '⚠️');
    return;
  }
  const suggestion = matches.map(m=>'❖ ' + (m.item.goal || m.item.title)).join('\n');
  state.answers['diag_needs'] = (state.answers['diag_needs'] ? state.answers['diag_needs']+'\n' : '') + suggestion;
  saveState();
  refreshIfFieldVisible('diag_needs');
  toast('تمت إضافة اقتراحات إلى قائمة الحاجات', '✨');
  renderAssistant();
}
function assistDraftProblematic(){
  const needs = (state.answers['diag_needs']||'').split('\n').filter(Boolean);
  if(needs.length===0){
    toast('أكمل مرحلة التشخيص وحدد الحاجات أولاً', '⚠️');
    return;
  }
  const firstNeed = needs[0].replace(/^❖\s*/,'');
  const draft = 'كيف يمكن معالجة "' + firstNeed + '" لدى الفئة المستهدفة داخل المؤسسة؟';
  if(!state.answers['prob_main']){
    state.answers['prob_main'] = draft;
  } else {
    state.answers['prob_main'] += '\n❖ اقتراح بديل: ' + draft;
  }
  saveState();
  refreshIfFieldVisible('prob_main');
  toast('تم توليد مسودة إشكالية، يمكنك تعديلها', '✨');
  renderAssistant();
}
function assistSuggestSmartRow(){
  const general = state.answers['obj_general'] || state.answers['prob_main'] || '';
  if(!general.trim()){
    toast('اكتب الهدف العام أولاً في هذه المرحلة', '⚠️');
    return;
  }
  const row = {
    goal: 'تحقيق: ' + general.slice(0,60) + (general.length>60?'…':''),
    indicator: 'عدد المستفيدين / نسبة التغيير المحققة',
    target: 'حدد رقماً واقعياً (مثال: 100 مستفيد أو 30%)',
    deadline: 'خلال 6 أشهر من انطلاق المشروع'
  };
  if(!state.answers['obj_smart'] || state.answers['obj_smart'].length===0){
    state.answers['obj_smart'] = [row];
  } else {
    const rows = state.answers['obj_smart'];
    const isEmptyOnly = rows.length===1 && Object.values(rows[0]).every(v=>!v);
    if(isEmptyOnly) state.answers['obj_smart'] = [row];
    else state.answers['obj_smart'].push(row);
  }
  saveState();
  refreshIfFieldVisible('obj_smart');
  toast('تمت إضافة اقتراح هدف SMART — عدّل التفاصيل ليلائم مشروعك', '✨');
  renderAssistant();
}
function assistSuggestActivities(){
  const query = (state.answers['diag_target']||'') + ' ' + (state.answers['obj_general']||'') + ' ' + (state.answers['diag_needs']||'');
  const matches = searchLibrary(query, 1);
  if(matches.length===0 || matches[0].tier!=='full'){
    toast('لم أجد نموذجاً مشابهاً كافياً بعد، أكمل التشخيص والأهداف أولاً', '⚠️');
    return;
  }
  const idea = matches[0].item;
  const newRows = idea.activities.map(a=>({name:a, goal:'', target: state.answers['diag_target']||idea.target, when:'', partners:''}));
  const existing = state.answers['plan_activities'] || [];
  const isEmptyOnly = existing.length<=1 && (existing.length===0 || Object.values(existing[0]).every(v=>!v));
  state.answers['plan_activities'] = isEmptyOnly ? newRows : [...existing, ...newRows];
  saveState();
  refreshIfFieldVisible('plan_activities');
  toast('تمت إضافة أنشطة مقترحة من نموذج «'+idea.title+'»', '✨');
  renderAssistant();
}
function assistSuggestIndicators(){
  const query = (state.answers['diag_target']||'') + ' ' + (state.answers['obj_general']||'');
  const matches = searchLibrary(query, 1);
  if(matches.length===0 || matches[0].tier!=='full'){
    toast('لم أجد نموذجاً مشابهاً كافياً بعد', '⚠️');
    return;
  }
  const idea = matches[0].item;
  const newRows = idea.indicators.map(i=>({indicator:i, type:'', method:'', timing:''}));
  const existing = state.answers['mon_indicators'] || [];
  const isEmptyOnly = existing.length<=1 && (existing.length===0 || Object.values(existing[0]).every(v=>!v));
  state.answers['mon_indicators'] = isEmptyOnly ? newRows : [...existing, ...newRows];
  saveState();
  refreshIfFieldVisible('mon_indicators');
  toast('تمت إضافة مؤشرات مقترحة من نموذج «'+idea.title+'»', '✨');
  renderAssistant();
}
function assistDraftSustainability(){
  if(!state.answers['sus_plan']){
    state.answers['sus_plan'] = 'اعتماد برنامج سنوي متجدد للمشروع داخل المؤسسة، مع تكوين فريق دائم من الشباب المتطوعين لضمان استمراريته، وتوسيع الشراكات لتنويع مصادر الدعم بعد المرحلة التجريبية الأولى.';
    saveState();
    refreshIfFieldVisible('sus_plan');
    toast('تم توليد مسودة خطة استمرارية، يمكنك تخصيصها', '✨');
  } else {
    toast('الحقل معبأ بالفعل — عدّله يدوياً إن أردت', 'ℹ️');
  }
  renderAssistant();
}

/* ---------- Tab 3: Free-text chat (offline Q&A) ---------- */
function renderChatTab(){
  return `
    <div class="assist-chatlog" id="assistChatLog">
      ${assistState.chat.map(m=>`<div class="assist-msg ${m.role}">${m.text}</div>`).join('')}
    </div>
    <div class="assist-chat-input">
      <input type="text" id="assistChatInput" placeholder="اكتب سؤالك هنا...">
      <button onclick="sendAssistChat()">➤</button>
    </div>
  `;
}
function sendAssistChat(){
  const inp = document.getElementById('assistChatInput');
  const q = inp.value.trim();
  if(!q) return;
  assistState.chat.push({role:'user', text: esc(q)});
  const answer = computeAssistAnswer(q);
  assistState.chat.push({role:'bot', text: answer});
  inp.value='';
  renderAssistant();
  switchAssistTab('chat');
}
function computeAssistAnswer(query){
  const qn = normalizeAr(query);

  // 0) Is it asking about a specific term/jargon word?
  if(/معني|تعريف|ماهو|ما هو|ما هي|قاموس/.test(qn)){
    const g = bestGlossaryMatch(query);
    if(g) return '<strong>'+esc(g.term)+'</strong>: '+esc(g.def)+'<br><br>تفقد تبويب «📖 قاموس المصطلحات» لمزيد من المصطلحات.';
  }

  // 1) Does it look like a project/domain suggestion request?
  const libMatches = searchLibrary(query, 3);
  if(libMatches.length>0 && /مشروع|فكره|اقترح|نادي|شباب/.test(qn)){
    const lines = libMatches.map(m=>'• <strong>'+esc(m.item.title)+'</strong>'+(m.item.goal?(' — '+esc(m.item.goal.slice(0,90))+(m.item.goal.length>90?'…':'')) : '')).join('<br>');
    return 'وجدت لك هذه الاقتراحات من بنك الأفكار الجاهزة:<br><br>'+lines+'<br><br>افتح تبويب «💡 اقتراح مشاريع» لاستخدام أي منها كنقطة انطلاق مباشرة.';
  }

  // 2) Does it match a methodology step?
  const step = bestStepMatch(query);
  if(step){
    return 'بخصوص مرحلة <strong>«'+esc(step.title)+'»</strong>:<br>'+esc(step.objective)+'<br><br>خطوات عملية:<br>'
      + step.howTo.slice(0,3).map(h=>'• '+esc(h)).join('<br>')
      + '<br><br>افتح هذه المرحلة من المعالج لمزيد من التفاصيل والحقول الجاهزة للتعبئة، ولا تنسَ زر «💡 عرض مثال توضيحي» أسفل كل حقل.';
  }

  // 3) Does it match a glossary term even without explicit "معنى"?
  const g2 = bestGlossaryMatch(query);
  if(g2) return '<strong>'+esc(g2.term)+'</strong>: '+esc(g2.def);

  // 4) Fallback: library match without explicit keyword
  if(libMatches.length>0){
    const m = libMatches[0].item;
    return 'أقرب ما وجدته متعلقاً بسؤالك هو نموذج <strong>«'+esc(m.title)+'»</strong>'+(m.goal? (': '+esc(m.goal)) : '')+'. تفقد تبويب «اقتراح مشاريع» لمزيد من الخيارات المشابهة.';
  }

  return 'لم أجد إجابة دقيقة لسؤالك بعد 🤔. جرّب صياغة أخرى، أو اسألني عن مرحلة من مراحل المشروع (مثال: «كيف أصيغ الأهداف؟»)، أو عن معنى مصطلح (مثال: «ما معنى SMART؟»)، أو عن مجال مشروع تريد أفكاراً بشأنه (مثال: «اقترح مشروعاً عن الرياضة»).';
}

/* ---------- Tab 4: Glossary (beginner-friendly term explanations) ---------- */
function renderGlossaryTab(){
  return `
    <div class="assist-note">📖 مصطلحات منهجية المشروع البيداغوجي مشروحة بلغة مبسطة — مفيدة خصوصاً إن كنت تُعدّ مشروعاً بيداغوجياً للمرة الأولى.</div>
    ${GLOSSARY.map(g=>`
      <div class="assist-help-card">
        <h5>📌 ${esc(g.term)}</h5>
        <p>${esc(g.def)}</p>
      </div>
    `).join('')}
  `;
}

/* ---------- Field example helpers (used inside the wizard form) ---------- */
function toggleFieldExample(fieldId){
  const box = document.getElementById('example-'+fieldId);
  if(box) box.classList.toggle('hidden');
}
function useFieldExample(fieldId){
  const f = currentStepFieldDef(fieldId);
  if(!f || f.example===undefined) return;
  if(f.type==='text' || f.type==='textarea'){
    state.answers[fieldId] = f.example;
  } else if(f.type==='checklist'){
    state.answers[fieldId] = [...f.example];
  } else if(f.type==='group'){
    state.answers[fieldId] = f.example.map(r=>({...r}));
  }
  saveState();
  rerenderCurrentStepPreserveScroll();
  toast('تم إدراج المثال — عدّله ليلائم مشروعك الخاص', '💡');
}
